[workspace]
resolver = "3"
members = [
  "crates/hoard-gguf",
  "crates/hoard-core",
  "crates/hoard-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Meillaya <nathanagbomed@proton.me>"]
repository = "https://github.com/meillaya/hoard"

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
memmap2 = "0.9.12"
proptest = "1.12.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
